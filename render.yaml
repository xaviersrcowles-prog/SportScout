services:
  - type: web
    name: sportscout
    runtime: python
    plan: free

    buildCommand: npm install && npm run build && pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: AI_API_KEY
        sync: false

      - key: AI_PROVIDER
        value: openai

      - key: AI_MODEL
        value: gpt-4o-mini

      - key: FRONTEND_ORIGIN
        value: "*"

      - key: PYTHON_VERSION
        value: 3.11.9
